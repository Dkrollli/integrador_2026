<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Login - Tecnica Olinda</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body style="background:#2c3e50;">

    <!-- ================= LOGIN ================= -->
    <div class="login-box">

        <h:form id="formLogin">

            <h2>Tecnica Olinda</h2>

            <p:growl id="growlLogin" showDetail="true" life="3000"/>

            <div class="field">
                <p:inputText id="login"
                             placeholder="Login"
                             value="#{loginBean.login}"
                             required="true"
                             requiredMessage="Informe o login"/>
            </div>

            <div class="field">
                <p:password id="senha"
                            placeholder="Senha"
                            value="#{loginBean.senha}"
                            feedback="false"
                            required="true"
                            requiredMessage="Informe a senha"/>
            </div>

            <p:commandButton value="Entrar"
                             action="#{loginBean.entrar}"
                             update="growlLogin"
                             process="@form"
                             styleClass="btn-login"/>

        </h:form>

    </div>

</h:body>
</html>
